General:
  seed: 42
  init_T: 4
  max_tests: 10 #10
  algorithm: 'sim' # options: sim, improv, muscle (FUTURE)
  method: 'online' # options: online, offline
  data_folder: './data/'
  save_results: True

Neurons:
  N: 1 # number of neurons 
  tc_type: 'indep' # 'linear_uvn' # 'indep' # 'double_peaks' # how neuron population data are generated
  constraint: None #'peak_distance' #'linear'
  SimPop: 'auditory' # options: gaussian, pseudo, auditory (only used during simulation runs)

Stimuli:
  d: 2
  x1_range: 10 #5 #1.1 # center frequency
  x2_range: 10 #1.1 # level (dB)
  #x3_range: 6 #spectral bandwidth
  # x4_range: 8 #modulation frequency
  # x5_range: 15 #spatial location


Optimizer:
  mse_cutoff: 1
  gamma: 5 #1
  var: 0.5
  nu: 1 #1e-1
  eta: 1e-2
  optim_1:
    kernel: ['rbf', 'rbf'] #rbf'] #'rbf', 'rbf']  
    stopping_crit: .09 #.14 # 0.05 #0.02, 0.08, 0.37 #0.01, 0.1
